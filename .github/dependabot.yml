# Aggiornamenti dipendenze: PR raggruppate e settimanali, mai auto-merge.
# Le major (Electron, Capacitor, vitest…) arrivano a parte: richiedono test
# su device reali (APK) e sul PC-server prima di entrare.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      minor-patch:
        update-types: [minor, patch]
    # Le major NON arrivano da dependabot: Electron/Capacitor/TypeScript/
    # vitest richiedono collaudo su PC+telefono e coordinamento tra peer dep
    # (es. TS 7 rompe typescript-eslint <6.1; @capacitor/android 8 senza
    # cli/core allineati spezza il progetto). Si aggiornano a mano insieme.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
