name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimo privilegio: la CI legge il codice e basta (niente scrittura su
# release/contenuti anche se uno step venisse compromesso).
permissions:
  contents: read

# Un push nuovo sullo stesso branch/PR annulla la run vecchia.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Tests
        run: npx vitest run
      - name: Build (main + preload + renderer)
        run: npm run build
      # Le dipendenze che finiscono nel prodotto devono restare a 0
      # vulnerabilità note (quelle dev-only non entrano nell'installer/APK).
      - name: Audit dipendenze di produzione
        run: npm audit --omit=dev --audit-level=moderate

  android-compile:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci && npm run build
      - name: Sync Capacitor (genera cordova.variables.gradle e assets)
        run: npx cap sync android
      - name: Compila il plugin nativo (MediaSession, PlaybackService)
        working-directory: android
        run: ./gradlew.bat :app:compileReleaseJavaWithJavac --no-daemon
