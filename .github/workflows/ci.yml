name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run
      - name: Build (main + preload + renderer)
        run: npm run build

  android-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci && npm run build
      - name: Sync Capacitor (genera cordova.variables.gradle e assets)
        run: npx cap sync android
      - name: Compila il plugin nativo (MediaSession, PlaybackService)
        working-directory: android
        run: ./gradlew.bat :app:compileReleaseJavaWithJavac --no-daemon
