<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <!-- http: serve per il client remoto: telefono → PC sulla stessa rete LAN -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: media: data:; media-src 'self' https: http: media:; style-src 'self' 'unsafe-inline'; connect-src 'self' https: http:" />
    <!-- Niente Referer verso le thumbnail esterne (i.ytimg.com): l'URL di
         ingresso dal QR può contenere il token di pairing -->
    <meta name="referrer" content="no-referrer" />
    <title>MasterHype</title>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background:
          radial-gradient(600px 380px at 78% 18%, rgba(45,212,191,.14), transparent 65%),
          radial-gradient(520px 340px at 16% 82%, rgba(255,158,61,.12), transparent 65%),
          radial-gradient(400px 300px at 50% 110%, rgba(45,212,191,.07), transparent 65%),
          #0a0a0b;
        font-family: 'Segoe UI', system-ui, sans-serif;
        transition: opacity .5s ease;
      }
      #splash .eq { display: flex; gap: 5px; align-items: flex-end; height: 26px; }
      #splash .eq i {
        width: 5px; height: 26px; border-radius: 2px;
        background: linear-gradient(to top, #2dd4bf, #ff9e3d);
        box-shadow: 0 0 10px rgba(45,212,191,.5);
        animation: splash-eq 1s ease-in-out infinite; transform-origin: bottom;
      }
      #splash .eq i:nth-child(2) { animation-delay: .15s; }
      #splash .eq i:nth-child(3) { animation-delay: .32s; }
      #splash .eq i:nth-child(4) { animation-delay: .08s; }
      #splash .eq i:nth-child(5) { animation-delay: .24s; }
      @keyframes splash-eq { 0%,100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash .logo { animation: splash-in .7s cubic-bezier(.2,.9,.3,1.3) both; border-radius: 22%; }
      #splash .name {
        font-size: 26px; font-weight: 800; letter-spacing: -.5px; color: #f2f2f8;
        animation: splash-in .7s .15s cubic-bezier(.2,.9,.3,1.3) both;
      }
      #splash .name b { color: #ff9e3d; font-weight: 800; }
      #splash .bar {
        width: 160px; height: 3px; border-radius: 2px; overflow: hidden;
        background: #1a1a26; animation: splash-in .5s .35s ease both;
      }
      #splash .bar i {
        display: block; height: 100%; width: 40%; border-radius: 2px;
        background: linear-gradient(90deg, #2dd4bf, #ff9e3d);
        animation: splash-bar 1.1s ease-in-out infinite;
      }
      #splash .pulse { animation: splash-pulse 1.6s .6s ease-in-out infinite; }
      @keyframes splash-in { from { opacity: 0; transform: translateY(14px) scale(.92); } to { opacity: 1; transform: none; } }
      @keyframes splash-bar { 0% { transform: translateX(-110%);} 100% { transform: translateX(400%);} }
      @keyframes splash-pulse { 0%,100% { filter: drop-shadow(0 0 0 rgba(45,212,191,0)); } 50% { filter: drop-shadow(0 0 18px rgba(45,212,191,.45)); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <img class="logo pulse" src="./icon-192.png" width="72" height="72" alt="" />
      <div class="name">Master<b>Hype</b></div>
      <div class="eq"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
